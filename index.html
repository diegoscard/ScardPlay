    <title>SCARD PLAY IPTV - A Evolução da TV a Cabo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #ffffff;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      
      /* Global helper for glassmorphism if needed outside tailwind */
      .glass-container {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      @keyframes bounce-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-bounce-slow {
        animation: bounce-slow 4s ease-in-out infinite;
      }

      /* Animated Border for Highlighted Card */
      @keyframes border-rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .animated-border-container {
        position: relative;
        padding: 2px;
        border-radius: 1.5rem;
        overflow: hidden;
        z-index: 1;
      }

      .animated-border-container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          transparent,
          rgba(204, 0, 0, 1),
          transparent 35%
        );
        animation: border-rotate 4s linear infinite;
        z-index: -2;
      }

      .animated-border-container::after {
        content: '';
        position: absolute;
        inset: 2px;
        background: rgba(5, 5, 5, 0.8);
        backdrop-filter: blur(20px);
        border-radius: 1.45rem;
        z-index: -1;
      }
    </style>
